name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  BUILD_TOOLS: 34.0.0

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK/NDK installieren (SDK ist auf dem Runner vorinstalliert)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -n1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Tauri CLI (lokal, damit Gradle sie wiederfindet)
        run: npm ci

      - name: Versionscode setzen (fortlaufend → Updates installierbar)
        run: |
          jq --argjson vc "${{ github.run_number }}" '.bundle.android.versionCode = $vc' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Shorts komprimieren (max. 720p, H.264, Fast-Start → kleine APK, sofortiger Start)
        run: |
          shopt -s nullglob nocaseglob
          files=(ui/shorts/*.mp4 ui/shorts/*.m4v)
          if [ ${#files[@]} -eq 0 ]; then echo "Keine Shorts vorhanden"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          for f in "${files[@]}"; do
            tmp="${f%.*}.ci-tmp.mp4"
            ffmpeg -nostdin -loglevel error -y -i "$f" \
              -vf "scale='if(gt(iw,ih),-2,min(720,iw))':'if(gt(iw,ih),min(720,ih),-2)'" \
              -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -c:a aac -b:a 96k -ac 2 \
              -movflags +faststart "$tmp"
            before=$(stat -c%s "$f"); after=$(stat -c%s "$tmp")
            if [ "$after" -lt "$before" ]; then mv "$tmp" "$f"; else rm "$tmp"; fi
            echo "$f: $((before/1024)) KB → $(( $(stat -c%s "$f")/1024 )) KB"
          done

      - name: Android-Projekt erzeugen
        run: |
          npm run tauri -- android init --ci
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/

      - name: APK bauen
        run: npm run tauri -- android build --apk --ci --target aarch64 --target armv7

      - name: APK signieren
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks; PASS="$KS_PASS"
          else
            cp keystore/lernkartei.jks release.jks; PASS=lernkartei
          fi
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -n1)
          echo "Unsigniert: $APK"
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias lernkartei --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out LernKartei.apk aligned.apk
          "$BT/apksigner" verify --print-certs LernKartei.apk
          ls -lh LernKartei.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LernKartei-apk
          path: LernKartei.apk

      - name: Release veröffentlichen
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}-build.${{ github.run_number }}"; fi
          gh release create "$TAG" LernKartei.apk \
            --target "$GITHUB_SHA" \
            --title "LernKartei $TAG" \
            --notes "Android-APK (arm64 + armv7). Herunterladen, öffnen, Installation aus unbekannten Quellen erlauben. Updates lassen sich über die vorhandene App installieren – der Lernfortschritt bleibt erhalten. Commit: $GITHUB_SHA"
